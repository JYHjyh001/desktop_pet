<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <style>
    .pet { transform-origin: 64px 44px; animation: dragTilt .72s ease-in-out infinite; }
    .tail { transform-origin: 92px 96px; animation: tailDrag .72s ease-in-out infinite; }
    .skirt { transform-origin: 64px 88px; animation: skirtSwing .72s ease-in-out infinite; }
    .foot-left { transform-origin: 54px 98px; animation: footA .72s ease-in-out infinite; }
    .foot-right { transform-origin: 74px 98px; animation: footB .72s ease-in-out infinite; }
    @keyframes dragTilt {
      0%, 100% { transform: rotate(-4deg) translateY(0); }
      50% { transform: rotate(5deg) translateY(3px); }
    }
    @keyframes tailDrag {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-7deg); }
    }
    @keyframes skirtSwing {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-4deg); }
    }
    @keyframes footA {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes footB {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(9deg); }
    }
  </style>
