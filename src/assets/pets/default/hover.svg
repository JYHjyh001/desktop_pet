<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <style>
    .pet { transform-origin: 64px 92px; animation: perk 1.1s ease-in-out infinite; }
    .wave { transform-origin: 44px 70px; animation: wave 1.05s ease-in-out infinite; }
    .tail { transform-origin: 92px 96px; animation: tailWave 1.05s ease-in-out infinite; }
    @keyframes perk {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(-10deg); }
      45% { transform: rotate(18deg); }
      70% { transform: rotate(-2deg); }
    }
    @keyframes tailWave {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }
  </style>
