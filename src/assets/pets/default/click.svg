<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <style>
    .pet { transform-origin: 64px 92px; animation: bounce 1.1s ease-in-out 1 both; }
    .heart { transform-box: fill-box; transform-origin: center; opacity: 0; animation: heartPop 1.2s ease-in-out 1 both; }
    .heart.two { animation-delay: .15s; }
    .heart.three { animation-delay: .3s; }
    @keyframes bounce {
      0%, 100% { transform: scale(1) translateY(0); }
      35% { transform: scale(1.04) translateY(-3px); }
      65% { transform: scale(.99) translateY(1px); }
    }
    @keyframes heartPop {
      0% { opacity: 0; transform: scale(.45) translateY(6px); }
      25%, 72% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(.78) translateY(-8px); }
    }
  </style>
