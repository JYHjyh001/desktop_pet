<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <style>
    .pet { transform-origin: 64px 96px; animation: breathe 2.8s ease-in-out infinite; }
    .eye { transform-origin: center; animation: blink 3.6s infinite; }
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes blink {
      0%, 88%, 100% { transform: scaleY(1); }
      91%, 95% { transform: scaleY(0.12); }
    }
  </style>
  <g class="pet">
    <path d="M34 28 C28 12 44 8 50 28 Z" fill="#ffbf66" stroke="#243049" stroke-width="4" stroke-linejoin="round"/>
    <path d="M94 28 C100 12 84 8 78 28 Z" fill="#ffbf66" stroke="#243049" stroke-width="4" stroke-linejoin="round"/>
    <rect x="30" y="24" width="68" height="62" rx="29" fill="#ffc66d" stroke="#243049" stroke-width="4"/>
    <circle cx="42" cy="39" r="7" fill="#fff7e7"/>
    <ellipse class="eye" cx="50" cy="54" rx="5" ry="8" fill="#243049"/>
    <ellipse class="eye" cx="78" cy="54" rx="5" ry="8" fill="#243049"/>
    <ellipse cx="42" cy="68" rx="8" ry="4" fill="#ff7c89" opacity=".42"/>
    <ellipse cx="86" cy="68" rx="8" ry="4" fill="#ff7c89" opacity=".42"/>
    <path d="M58 69 Q64 75 70 69" fill="none" stroke="#243049" stroke-width="3" stroke-linecap="round"/>
    <rect x="42" y="80" width="44" height="30" rx="17" fill="#43c6d8" stroke="#243049" stroke-width="4"/>
    <circle cx="64" cy="94" r="6" fill="#fff" stroke="#243049" stroke-width="3"/>
  </g>
</svg>
