name: Official feature distribution

on:
  push:
    branches:
      - codex/feature-packages
  pull_request:
    branches:
      - codex/feature-packages

permissions:
  contents: read

jobs:
  distribution:
    name: Verify signed catalog and feature packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout distribution files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test verification with valid and tampered synthetic artifacts
        run: node --test scripts/verify-feature-publication.test.mjs

      - name: Verify actual distribution files against reviewed public trust
        run: node scripts/verify-feature-publication.mjs .
